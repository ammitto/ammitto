# frozen_string_literal: true

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: ['**']

jobs:
  test:
    name: Test on Ruby ${{ matrix.ruby }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ['3.3', '3.4']
    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - name: Run specs
        run: bundle exec rake

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Run Rubocop
        run: bundle exec rubocop --parallel

      # The fleet monitor's own self-test. It already runs in
      # fleet-health.yml on schedule, dispatch and push to main, but on no
      # pull request, so a PR editing the monitor got no verification until
      # it had already landed.
      #
      # It stubs `gh` and makes no API call, so it costs runner seconds
      # rather than API budget.
      - name: Self-test the fleet health monitor
        run: scripts/fleet_health_test.sh
