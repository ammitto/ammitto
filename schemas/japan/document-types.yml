# JSON Schema for Document Types
# For IDE yaml-language-server support, keep the comment reference above
---
$schema: http://json-schema.org/draft-04/schema#
title: Document Types
description: Schema for validating document type taxonomy YAML files
type: object
required:
  - document_types
properties:
  document_types:
    type: array
    minItems: 1
    items:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: string
          pattern: "^jp/[a-z0-9-]+$"
          description: Unique identifier for the document type (e.g., "jp/ministry-of-commerce-order")
        name:
          type: object
          minProperties: 1
          properties:
            ja:
              type: string
              description: Japanese name (Japanese)
            en:
              type: string
              description: English name
          additionalProperties: false
      additionalProperties: false
additionalProperties: false
