# Ontology-Driven Data Validation Workflow
#
# This workflow ensures 100% coverage between Neo4j content and JSON-LD exports
# by using the SAME ontology classes for both import and export.
#
# Validation steps:
# 1. Start Neo4j container
# 2. Import all data to Neo4j using ontology classes
# 3. Validate schema compliance (property coverage)
# 4. Validate relationship integrity (cross-link validity)
# 5. Verify round-trip (import = export)
# 6. Export JSON-LD using ontology classes
# 7. Generate coverage report
#
# This guarantees that whatever is imported CAN be exported.

name: Ontology Data Validation

on:
  push:
    branches: [main]
    paths:
      - 'lib/ammitto/ontology/**'
      - 'scripts/import_*.rb'
      - 'scripts/export_*.rb'
      - 'scripts/validate_*.rb'
      - 'scripts/verify_*.rb'
      - '.github/workflows/ontology-data-validation.yml'
  pull_request:
    paths:
      - 'lib/ammitto/ontology/**'
      - 'scripts/import_*.rb'
      - 'scripts/export_*.rb'
      - 'scripts/validate_*.rb'
      - 'scripts/verify_*.rb'
      - '.github/workflows/ontology-data-validation.yml'
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'  # Daily validation at 6 AM UTC

env:
  NEO4J_VERSION: '5.15-community'
  NEO4J_PASSWORD: 'password'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          path: 'ammitto'
          fetch-depth: 0

      # The data lives in separate ammitto/data-* repositories (the gem's
      # sibling-directory convention). Clone them next to the gem checkout
      # on every trigger except pull_request, where validation skips
      # gracefully instead.
      # DATA_REPOS_TOKEN is optional: the data-* repos are public today,
      # so github.token suffices; the secret takes over if that changes.
      - name: Clone data repositories
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.DATA_REPOS_TOKEN || github.token }}
        run: |
          repos=$(gh repo list ammitto --limit 100 --json name \
            --jq '.[].name | select(startswith("data-"))')
          if [ -z "$repos" ]; then
            echo "::error::no ammitto/data-* repositories found"
            exit 1
          fi
          for repo in $repos; do
            gh repo clone "ammitto/$repo" "$repo" -- --depth 1
          done

      - name: Detect data availability
        id: data
        run: |
          count=$(find . -maxdepth 2 -type d -path './data-*/processed' | wc -l)
          if [ "$count" -gt 0 ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "Found $count data-*/processed directories"
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "PR context: data repositories are not cloned here." \
              "Full validation runs on main, nightly, and manual dispatch."
          else
            echo "::error::data repositories cloned but no data-*/processed found"
            exit 1
          fi

      - name: Setup Ruby
        if: steps.data.outputs.available == 'true'
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: 'ammitto'

      - name: Start Neo4j
        if: steps.data.outputs.available == 'true'
        run: |
          docker run -d --name ammitto-neo4j-test \
            -p 7687:7687 -p 7474:7474 \
            -e NEO4J_AUTH=neo4j/${{ env.NEO4J_PASSWORD }} \
            -e NEO4J_PLUGINS='["apoc"]' \
            neo4j:${{ env.NEO4J_VERSION }}

      - name: Wait for Neo4j
        if: steps.data.outputs.available == 'true'
        run: |
          for i in {1..30}; do
            if docker exec ammitto-neo4j-test cypher-shell -u neo4j -p ${{ env.NEO4J_PASSWORD }} "RETURN 1" &>/dev/null; then
              echo "Neo4j is ready"
              exit 0
            fi
            sleep 2
          done
          echo "Neo4j failed to start"
          exit 1

      # Step 1: Import data using ontology classes
      - name: Import to Neo4j
        if: steps.data.outputs.available == 'true'
        run: |
          cd ammitto
          echo "=== IMPORTING DATA USING ONTOLOGY CLASSES ==="
          bundle exec ruby scripts/import_neo4j_full.rb
        env:
          NEO4J_URI: 'bolt://localhost:7687'
          AMMITTO_DATA_DIR: ${{ github.workspace }}

      # Step 2: Validate schema compliance
      - name: Validate schema (property coverage)
        id: schema
        if: steps.data.outputs.available == 'true'
        run: |
          cd ammitto
          echo "=== SCHEMA VALIDATION ==="
          echo "Checking that all declared properties exist in Neo4j nodes"
          bundle exec ruby scripts/validate_neo4j_data.rb --type schema
        env:
          NEO4J_URI: 'bolt://localhost:7687'
        continue-on-error: true

      # Step 3: Validate relationship integrity
      - name: Validate relationships (cross-link validity)
        id: integrity
        if: steps.data.outputs.available == 'true'
        run: |
          cd ammitto
          echo "=== RELATIONSHIP INTEGRITY ==="
          echo "Checking that all relationships point to valid nodes"
          bundle exec ruby scripts/validate_neo4j_data.rb --type integrity
        env:
          NEO4J_URI: 'bolt://localhost:7687'
        continue-on-error: true

      # Step 4: Check for orphaned nodes
      - name: Detect orphaned nodes
        id: orphans
        if: steps.data.outputs.available == 'true'
        run: |
          cd ammitto
          echo "=== ORPHAN DETECTION ==="
          bundle exec ruby scripts/validate_neo4j_data.rb --type orphans
        env:
          NEO4J_URI: 'bolt://localhost:7687'
        continue-on-error: true

      # Step 5: Verify round-trip (import = export)
      - name: Round-trip verification
        id: roundtrip
        if: steps.data.outputs.available == 'true'
        run: |
          cd ammitto
          echo "=== ROUND-TRIP VERIFICATION ==="
          echo "Verifying that imported data matches exported data"
          bundle exec ruby scripts/verify_round_trip.rb --sample-size 50
        env:
          NEO4J_URI: 'bolt://localhost:7687'
          AMMITTO_DATA_DIR: ${{ github.workspace }}
        continue-on-error: true

      # Step 6: Export using ontology classes
      - name: Export JSON-LD (ontology-driven)
        if: steps.data.outputs.available == 'true'
        run: |
          cd ammitto
          echo "=== EXPORTING JSON-LD USING ONTOLOGY CLASSES ==="
          bundle exec ruby scripts/export_json_ld_ontology.rb --output-dir /tmp/json-ld
        env:
          NEO4J_URI: 'bolt://localhost:7687'

      # Step 7: Generate coverage report
      - name: Generate coverage report
        id: coverage
        if: steps.data.outputs.available == 'true'
        run: |
          cd ammitto
          echo "=== COVERAGE REPORT ==="
          bundle exec ruby scripts/validate_neo4j_data.rb --type coverage
        env:
          NEO4J_URI: 'bolt://localhost:7687'

      # Step 8: Quality gates summary
      - name: Quality gates summary
        if: steps.data.outputs.available == 'true'
        run: |
          cd ammitto
          echo ""
          echo "=========================================="
          echo "QUALITY GATES SUMMARY"
          echo "=========================================="
          echo ""
          echo "Schema validation: ${{ steps.schema.outcome }}"
          echo "Relationship integrity: ${{ steps.integrity.outcome }}"
          echo "Orphan detection: ${{ steps.orphans.outcome }}"
          echo "Round-trip verification: ${{ steps.roundtrip.outcome }}"
          echo "Coverage report: ${{ steps.coverage.outcome }}"
          echo ""

          # Fail if any critical validation failed
          if [ "${{ steps.schema.outcome }}" == "failure" ] || \
             [ "${{ steps.orphans.outcome }}" == "failure" ]; then
            echo "❌ CRITICAL VALIDATION FAILED"
            exit 1
          fi

          if [ "${{ steps.integrity.outcome }}" == "failure" ] || \
             [ "${{ steps.roundtrip.outcome }}" == "failure" ]; then
            echo "⚠️  WARNING: Some validations had issues"
            echo "Check the logs above for details"
          fi

          echo "✓ ALL CRITICAL VALIDATIONS PASSED"

      # Upload artifacts
      - name: Upload JSON-LD export
        if: steps.data.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: json-ld-ontology-export
          path: /tmp/json-ld/
          retention-days: 7

      - name: Upload validation logs
        uses: actions/upload-artifact@v4
        if: always() && steps.data.outputs.available == 'true'
        with:
          name: validation-logs
          path: |
            ammitto/*.log
          retention-days: 7
        continue-on-error: true

      - name: Stop Neo4j
        if: always() && steps.data.outputs.available == 'true'
        run: |
          docker stop ammitto-neo4j-test || true
          docker rm ammitto-neo4j-test || true

  # Summary job that runs after validation
  validation-summary:
    needs: validate
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check validation result
        run: |
          echo "Validation completed"
          echo "Result: ${{ needs.validate.result }}"
          if [ "${{ needs.validate.result }}" == "failure" ]; then
            echo "::error::Data validation failed. Check the validation job for details."
            exit 1
          fi
