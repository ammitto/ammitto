inherit_from: .rubocop_todo.yml

plugins:
  - rubocop-rspec

# This project follows the Ribose OSS style guide.
# https://github.com/riboseinc/oss-guides
# All project-specific additions and overrides should be specified in this file.

AllCops:
  TargetRubyVersion: 3.3
  Rails:
    Enabled: false
  Layout:
    IndentationWidth: 2
    LineLength: 80
  NewCops: enable
  SuggestExtensions: false

Style/FrozenStringLiteralComment:
  Enabled: false

Metrics/MethodLength:
  Max: 50

Metrics/ClassLength:
  Max: 300

Metrics/BlockLength:
  Max: 50
  Exclude:
    - 'spec/**/*.rb'
    - 'docs/**/*.rb'
    - 'scripts/**/*.rb'

# Defaults plus ja/en: ISO language codes mirroring the multilingual model
# attributes
Naming/MethodParameterName:
  AllowedNames:
    - as
    - at
    - by
    - cc
    - db
    - id
    - if
    - in
    - io
    - ip
    - of
    - 'on'
    - os
    - pp
    - to
    - ja
    - en

# Unsafe autocorrect rewrites substring-membership checks
# (keywords.any? { |k| str.include?(k) }) into Array#intersect? with a String
# argument, which raises TypeError at runtime.
Style/ArrayIntersect:
  Enabled: false

# Centralized ontology vocabulary and normalization module: its length
# tracks the sanctions-domain vocabulary (schema-driven), not code
# complexity.
Metrics/ModuleLength:
  Exclude:
    - 'lib/ammitto/ontology/types.rb'

Lint/ConstantDefinitionInBlock:
  Exclude:
    - 'spec/**/*.rb'

# rubocop-rspec. Two cops were adopted deliberately —
# RSpec/MultipleDescribes and RSpec/SpecFilePathFormat — because they enforce
# the one-describe-per-file, path-mirrors-the-class spec layout; every offence
# of theirs is fixed in the tree, none deferred to .rubocop_todo.yml.
# The 15 cops switched off below are the ones that fired against this suite:
# it has never been written to those styles, and recording a decision beats
# parking a backlog. The rest of the RSpec department stays on, since the
# suite already satisfies it and those cops guard the specs written next.

# Specs mirror the class name. Where a namespace intentionally and
# systematically differs from its directory, the cop is told the alias
# instead of churning the tree: Ammitto::Cmd covers all ten commands in
# lib/ammitto/cli/, so cli/ is that namespace's settled home.
# A one-off mismatch is the opposite case and gets no alias — Ammitto::Registry
# sits in lib/ammitto/sources/ without joining that namespace, so its spec
# moved to spec/ammitto/registry_spec.rb to match the constant, and the lib
# file is left for a separate decision (G30).
RSpec/SpecFilePathFormat:
  CustomTransform:
    Cmd: cli

# Grouping the assertions that describe one behaviour is deliberate here.
RSpec/MultipleExpectations:
  Enabled: false

# 191 offences in 41 files spanning every area of the suite, from inline
# fixture trees to long `include(...)` assertion lists.
RSpec/ExampleLength:
  Enabled: false

# The legacy-shim, harmonize-pipeline and public-API specs hold their tmpdir
# paths in @ivars set by an `around` hook.
RSpec/InstanceVariable:
  Enabled: false

# Bare `subject` is the convention in the five harmonized-model specs.
RSpec/NamedSubject:
  Enabled: false

# All 15 are the Neo4j round-trip spec, nested by entity type then by method.
RSpec/NestedGroups:
  Enabled: false

# `match` here carries error-message fragments and a hostname, not patterns
# that would read better as `include`.
RSpec/MatchWithSimpleRegex:
  Enabled: false

# Integration, load-order, schema-path, legacy-shim and list-identity specs
# describe behaviour rather than a single class.
RSpec/DescribeClass:
  Enabled: false

# All 8 are spec/ammitto_spec.rb calling the public API as `Ammitto.…`.
RSpec/DescribedClass:
  Enabled: false

# In the model and AU transformer specs `subject` is placed after the `let`s
# it consumes.
RSpec/LeadingSubject:
  Enabled: false

# The China extractor spec keeps its five stubs one per line.
RSpec/ReceiveMessages:
  Enabled: false

# Frozen fixture hashes and helper lambdas are built once at group scope.
RSpec/LeakyLocalVariable:
  Enabled: false

# One spec names a BaseSource subclass inline to register it; the constant
# outlives its example, and nothing else in the suite reads it.
RSpec/LeakyConstantDeclaration:
  Enabled: false

# Matcher-style preferences the suite does not follow.
RSpec/BeEq:
  Enabled: false

RSpec/BeNil:
  Enabled: false

RSpec/PredicateMatcher:
  Enabled: false
