# JSON Schema for the China sanction list registry (supporting/sanction-lists.yml)
---
title: Sanction Lists
description: Schema for validating the China sanction list registry YAML file
type: object
required:
  - sanction_lists
properties:
  sanction_lists:
    type: array
    minItems: 1
    items:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: string
          enum:
            - cn/anti-sanction-list
            - cn/unreliable-entity-list
            - cn/export-control-list
            - cn/import-export-control-list
          description: Sanction list id, as used by sanction_list in announcements
        name:
          type: object
          required:
            - zh-Hans
          properties:
            zh-Hans:
              type: string
              description: Chinese name (Simplified)
            en:
              type: string
              description: English name
          additionalProperties: false
      additionalProperties: false
additionalProperties: false
